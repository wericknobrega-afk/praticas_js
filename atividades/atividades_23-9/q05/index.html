<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo do Salário do Professor</title>
</head>
<body>

    <h2>Calculadora de Salário do Professor</h2>

    <label for="valorHora">Valor da hora-aula (R$):</label>
    <input type="number" id="valorHora" placeholder="Ex: 35.00" step="0.01" min="0"><br><br>

    <label for="horasTrabalhadas">Quantidade de horas trabalhadas:</label>
    <input type="number" id="horasTrabalhadas" placeholder="Ex: 160" step="0.5" min="0"><br><br>
    
    <button onclick="calcularSalario()">Calcular Salário</button>

    <p id="resultado"></p>

    <script src="script.js"></script>

</body>
</html>
