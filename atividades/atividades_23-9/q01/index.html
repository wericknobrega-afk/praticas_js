<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 01</title>
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Questão 01</h1>
    <p>
       Escreva um programa que leia um valor em R$ (reais) e converta-o para US$ (dólar americano). Use a cotação
atual do dólar. 
    </p>

    <form id="formDados">
        <label for="">Valor em R$ (reais):</label>
        <input type="number" step="0.01" min="0.01" id="valorReais">

        <button type="submit">Converter para US$</button>
    </form>
        

    <p id="resultado"></p>
</body>
</html>
